<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob:; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>ExamFlow | 고등학교 시험 시간표 만들기</title>
    <meta
      name="description"
      content="고등학교 중간·기말고사 시간표를 만듭니다. 학생별 공통·선택 응시 과목을 반영해 하루에 몰리는 시험과 같은 날의 연속 시험을 줄입니다."
    />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/appearance.css" />
    <link rel="stylesheet" href="./css/typography.css" />
    <link rel="stylesheet" href="./css/layout.css?v=table-grid" />
  </head>
  <body>
    <a href="#view" class="skip-link">본문으로 건너뛰기</a>
    <div class="globalbar">
      <button
        class="top-brand"
        data-page="board"
        aria-label="ExamFlow 홈 · 시험 시간표"
      >
        <svg class="logo-symbol" viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="10" fill="#0879ef" />
          <rect x="8" y="8" width="8" height="8" rx="2.2" fill="white" />
          <rect x="20" y="8" width="8" height="8" rx="2.2" fill="white" />
          <rect x="8" y="20" width="8" height="8" rx="2.2" fill="white" />
          <rect
            x="20"
            y="20"
            width="8"
            height="8"
            rx="2.2"
            fill="#bde1ff"
          /></svg
        ><span class="logo-word">ExamFlow</span></button
      ><span class="global-sub">학생을 위한, 더 나은 시험 일정.</span>
      <div class="global-actions">
        <span><i class="dot"></i>오프라인</span
        ><button data-action="display" class="with-icon">
          <span class="icon" aria-hidden="true"
            ><svg viewBox="0 0 24 24">
              <path d="M4 7h16M4 17h16M9 4v6m6 4v6" /></svg
          ></span>
          화면 설정
        </button>
      </div>
    </div>
    <aside class="sidebar">
      <div class="brand">
        <span class="brandmark" aria-hidden="true"
          ><i></i><i></i><i></i><i></i></span
        >ExamFlow
      </div>
      <div class="brand-sub">OFFLINE PLANNER</div>
      <div class="nav-label">시험 시간표 만들기</div>
      <nav class="nav" aria-label="주 메뉴">
        <button data-page="board" class="active">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="17" rx="3" />
            <path d="M3 10h18M8 2v5m8-5v5m-8 7h3m3 0h3m-9 4h3" /></svg
          >시험 시간표
        </button>
        <button data-page="data">
          <span class="icon" aria-hidden="true"
            ><svg viewBox="0 0 24 24">
              <path
                d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M16 3a4 4 0 010 8m6 10v-2a4 4 0 00-3-3.87M13 7a4 4 0 11-8 0 4 4 0 018 0"
              /></svg></span
          ><span>과목·학생 자료</span>
        </button>
        <button data-page="settings">
          <svg viewBox="0 0 24 24">
            <path d="M4 7h16M4 17h16" />
            <circle cx="9" cy="7" r="3" fill="currentColor" />
            <circle cx="15" cy="17" r="3" fill="currentColor" /></svg
          >시험 설정
        </button>
      </nav>
      <div class="sidebar-bottom">
        <div><span class="dot"></span>내 컴퓨터에서 실행 중</div>
        <p class="muted" style="margin-top: 6px; font-size: 11px">
          인터넷 없이, 자료 전송 없이.
        </p>
        <div class="version">EXAMFLOW / VERSION 3.0</div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <span class="crumb"
          >내 작업 공간 <span style="margin: 0 10px; color: #bbc4b8">/</span
          ><span id="crumb">시험 시간표</span></span
        >
        <div class="row">
          <button class="subtle small" data-action="loadProject">
            작업 열기</button
          ><button class="small" data-action="saveProject">작업 저장</button>
        </div>
      </header>
      <div id="view" tabindex="-1"></div>
    </main>
    <input
      id="rosterFile"
      type="file"
      accept=".xlsx,.csv,.tsv"
      class="file-control"
      aria-label="수강 자료 파일"
    /><input
      id="projectFile"
      type="file"
      accept=".json"
      class="file-control"
      aria-label="프로젝트 파일"
    />
    <dialog id="progressDialog">
      <div class="progress-icon">
        <span class="icon" aria-hidden="true"
          ><svg viewBox="0 0 24 24">
            <path
              d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3z"
            /></svg
        ></span>
      </div>
      <div class="eyebrow">LOCAL OPTIMIZATION</div>
      <h2>더 나은 배치를 찾고 있습니다.</h2>
      <p class="muted">하루에 몰리는 시험과 같은 날 연속 교시를 줄입니다.</p>
      <div class="progress-track"><i id="progressBar"></i></div>
      <p class="progress-caption" id="elapsedLabel">탐색 시간 경과</p>
      <div id="progressData" class="progress-data" aria-live="polite">
        응시 충돌이 없는 시간표를 찾는 중입니다.
      </div>
      <div class="actions">
        <button data-action="cancelSolve">탐색 취소</button>
      </div>
    </dialog>
    <dialog id="editDialog"></dialog>
    <dialog id="displayDialog" aria-label="화면 설정"></dialog>
    <dialog id="subjectDialog" aria-label="시험 과목 선택"></dialog>
    <noscript
      >이 프로그램은 JavaScript를 사용할 수 있는 브라우저가
      필요합니다.</noscript
    >
    <!-- Classic scripts load in order, including when the file is opened locally. -->
    <script src="./vendor/jszip.min.js"></script>
    <script src="./js/engine.js"></script>
    <script src="./js/io.js"></script>
    <script src="./data/demo.js"></script>
    <script src="./js/curriculum.js"></script>
    <script src="./js/state.js"></script>
    <script src="./js/views.js?v=table-grid"></script>
    <script src="./js/courses.js"></script>
    <script src="./js/scheduler.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
